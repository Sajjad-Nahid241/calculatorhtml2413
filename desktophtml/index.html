<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calculator</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: 'Segoe UI', sans-serif;
  }

  .calculator {
    background: #1e1e2f;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    width: 300px;
  }

  #display {
    width: 100%;
    height: 70px;
    background: #2a2a40;
    color: #fff;
    font-size: 32px;
    text-align: right;
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    margin-bottom: 16px;
    overflow-x: auto;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    height: 60px;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #33334d;
    color: #fff;
    transition: transform 0.1s, background 0.2s;
  }

  button:hover {
    background: #45456a;
  }

  button:active {
    transform: scale(0.95);
  }

  .operator {
    background: #764ba2;
  }

  .operator:hover {
    background: #8a5cb8;
  }

  .equals {
    background: #27ae60;
    grid-column: span 2;
  }

  .equals:hover {
    background: #2ecc71;
  }

  .clear {
    background: #e74c3c;
  }

  .clear:hover {
    background: #ff6b5b;
  }
</style>
</head>
<body>

  <div class="calculator">
    <input type="text" id="display" disabled value="0" />
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">⌫</button>
      <button class="operator" onclick="appendOperator('/')">÷</button>
      <button class="operator" onclick="appendOperator('*')">×</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="appendOperator('-')">−</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="appendOperator('+')">+</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button onclick="appendNumber('0')" style="grid-row: span 2;">0</button>

      <button onclick="appendNumber('.')">.</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </div>

<script>
  const display = document.getElementById('display');
  let firstNum = '';
  let secondNum = '';
  let activeOperator = null;
  let resetNextInput = false;

  function appendNumber(digit) {
    if (resetNextInput) {
      display.value = '';
      resetNextInput = false;
    }

    if (digit === '.' && display.value.includes('.')) return;

    if (display.value === '0' && digit !== '.') {
      display.value = digit;
    } else {
      display.value += digit;
    }
  }

  function appendOperator(op) {
    if (activeOperator !== null && !resetNextInput) {
      calculate();
    }

    firstNum = display.value;
    activeOperator = op;
    resetNextInput = true;
  }

  function clearDisplay() {
    display.value = '0';
    firstNum = '';
    secondNum = '';
    activeOperator = null;
    resetNextInput = false;
  }

  function deleteLast() {
    if (resetNextInput) return;
    display.value = display.value.slice(0, -1);
    if (display.value === '' || display.value === '-') {
      display.value = '0';
    }
  }

  function calculate() {
    if (activeOperator === null || resetNextInput) return;

    secondNum = display.value;
    const a = parseFloat(firstNum);
    const b = parseFloat(secondNum);
    let total = 0;

    switch (activeOperator) {
      case '+':
        total = a + b;
        break;
      case '-':
        total = a - b;
        break;
      case '*':
        total = a * b;
        break;
      case '/':
        if (b === 0) {
          display.value = 'Error';
          activeOperator = null;
          resetNextInput = true;
          return;
        }
        total = a / b;
        break;
      default:
        return;
    }

    display.value = Number.isInteger(total) ? total : parseFloat(total.toFixed(6));
    activeOperator = null;
    resetNextInput = true;
  }
</script>

</body>
</html>
